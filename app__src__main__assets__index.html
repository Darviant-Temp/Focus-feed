<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Feed</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#14141a;--mu:#6e6e7a;--ac:#5b5bf0;--ac2:#a35cf4;--bd:#e6e6ee;--sh:0 8px 28px rgba(20,20,50,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c11;--card:#16161e;--tx:#f2f2f7;--mu:#9b9bad;--ac:#7c7cf8;--bd:#25252f;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c11;--card:#16161e;--tx:#f2f2f7;--mu:#9b9bad;--ac:#7c7cf8;--bd:#25252f;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;letter-spacing:-.03em;margin:0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;margin-left:6px}
.pill small{color:var(--mu);font-weight:500}
.box{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.sr{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
input:focus{outline:2px solid var(--ac);outline-offset:0}
button{font:inherit;border:0;border-radius:14px;cursor:pointer}
.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 18px;font-weight:600}
.go:disabled{opacity:.5}
.chr{display:flex;gap:8px;align-items:flex-start;margin-top:12px}.ch{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0;max-height:38px;overflow:hidden}.ch.open{max-height:none}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:7px 12px;border-radius:99px;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{display:flex;align-items:center;justify-content:space-between}
.tm b{font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tm small,.lb{color:var(--mu);font-size:13px}
.cd h2{font-size:19px;letter-spacing:-.02em;margin:0 0 6px}
.cd p{margin:0 0 12px}
.ac{display:flex;gap:8px}
.s2{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:9px 14px;font-size:14px}
.ok{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:9px 14px;font-size:14px;font-weight:600}
.ok:disabled{opacity:.55}
.dp{white-space:pre-wrap;margin-top:10px;color:var(--mu)}
#st{color:var(--mu);text-align:center;margin:8px 0}
[hidden]{display:none!important}
.more{display:block;margin:6px auto;background:var(--bg);color:var(--ac);border:1px solid var(--bd);padding:10px 18px;font-weight:600}
details summary{cursor:pointer;font-weight:600}
.pk{padding:8px 0;border-top:1px solid var(--bd)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:14px;border-radius:16px;text-align:center;font-weight:600}
.cd{position:sticky;bottom:calc(12px + (5 - var(--k,0))*12px);box-shadow:0 -8px 22px rgba(20,20,50,.10),var(--sh)}
.cd.ex{position:relative;bottom:auto}
</style></head><body><main>
<div class="hd"><h1>Focus Feed</h1><div><span class="pill">★ <span id="pt">0</span> <small>points</small></span><span class="pill">🔥 <span id="sk">0</span> <small>days</small></span></div></div>
<div class="box tm" id="tmb"><div><b id="tm">15:00</b><br><small>One focused session</small></div><button class="go" id="ts">Start</button></div>
<div class="box"><div class="sr"><input id="q" placeholder="What do you want to learn?" enterkeyhint="search"><button class="go" id="go">Search</button></div><div class="chr"><div class="ch" id="ch"></div><button class="chip" id="cx" hidden>+</button></div></div>
<div id="feed"></div><div id="st"></div>
<button class="more" id="mr" hidden>Keep going</button><div id="sent" style="height:1px"></div>
<div class="box"><details><summary>History <span class="lb">(saved on this phone)</span></summary><button class="s2" id="dl" style="margin:10px 0">Save history file</button><div id="hl"></div></details></div>
<div class="box"><details><summary>Park it <span class="lb">(search later)</span></summary><div class="sr" style="margin-top:10px"><input id="pk" placeholder="Save a thought for later"><button class="go" id="pa">Add</button></div><div id="pl"></div></details></div>
<div class="box"><details><summary>PDFs <span class="lb">(your study files)</span></summary><button class="s2" id="pa2" style="margin:10px 0">+ Add PDF</button><div id="pdl"></div></details></div>
<div class="box"><details><summary>Settings</summary><input id="ky" type="password" placeholder="Paste your Gemini or Claude API key" style="margin-top:10px;width:100%"><button class="go" id="kb" style="margin-top:8px">Save key</button><div style="margin-top:10px"><button class="s2" id="ub">Allow YouTube detection</button> <button class="s2" id="bb">Battery settings</button></div></details></div>
</main>
<script>
(function(){var cb={},n=0;
window.__ai=function(id,t){var c=cb[id];if(!c)return;delete cb[id];if(t.indexOf("ERR:")==0)c[1]({code:"ai_error",message:t.slice(4)});else c[0](t)};
function ask(p){return new Promise(function(ok,no){if(!window.Android||!Android.hasKey()){no({code:"no_key",message:"Add your API key in Settings below."});return}var id="r"+(++n);cb[id]=[ok,no];Android.ask(id,p)})}
function sample(input,o){var p=typeof input=="string"?input:input.map(function(m){return m.role+": "+m.content}).join("\n");return ask(p).then(function(t){if(o&&o.onText)o.onText({text:t,delta:t});return{text:t,truncated:false}})}
sample.json=function(input,o){return sample(input,o).then(function(r){var t=r.text.replace(/```json|```/g,"").trim();var a=t.indexOf("["),b=t.lastIndexOf("]");if(a>=0&&b>a)t=t.slice(a,b+1);return JSON.parse(t)})};
window.claude={use:function(k){if(k=="sample")return Promise.resolve(sample);if(k=="downloads"&&window.Android)return Promise.resolve({save:function(o){Android.share(o.filename,o.data);return Promise.resolve()}});return Promise.resolve(null)}};
})();
</script>
<script>
var K="focusfeed1",S,ts="",n=0,seen=[],busy=0,endT=0,tick;
function $(i){return document.getElementById(i)}
function dk(d){return d.toLocaleDateString("en-CA")}
function wk(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dk(x)}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{};S.p=S.p||0;S.log=S.log||{};S.park=S.park||[];S.rec=S.rec||[];S.hist=S.hist||{};Object.keys(S.hist).forEach(function(k){if(Array.isArray(S.hist[k]))S.hist[k]={s:"",p:S.hist[k]}})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function streak(){var ks=Object.keys(S.log).sort();if(!ks.length)return 0;var d=new Date(ks[0]+"T00:00"),td=dk(new Date()),c=0,ru=0,w=wk(d);
while(dk(d)<td){var k=dk(d),ww=wk(d);if(ww!=w){w=ww;ru=0}
if((S.log[k]||0)>=3)c++;else if(!ru)ru=1;else c=0;
if(d.getDay()==0&&!ru)c++;d.setDate(d.getDate()+1)}
if((S.log[td]||0)>=3)c++;return c}
function stats(){$("pt").textContent=S.p;$("sk").textContent=streak()}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3200)}
function ai(){return(window.claude&&claude.use)?claude.use("sample"):Promise.resolve(null)}
function msg(t){$("st").textContent=t}
function chips(){var l=S.rec.length?S.rec:["How money works","Psychology of persuasion","How stock markets work"];$("ch").innerHTML="";l.forEach(function(t){var b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=function(){$("q").value=t;go()};$("ch").appendChild(b)});$("cx").hidden=S.rec.length<2}
var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12}):null;
function ob(d){if(io)io.observe(d);else d.classList.add("in")}
function card(c){var h=String(c.h||""),x=String(c.x||"");if(!h||!x)return;seen.push(h);hist(h,x);var d=document.createElement("div"),done=0;d.className="box cd";
var a=document.createElement("h2");a.textContent=h;var b=document.createElement("p");b.style.whiteSpace="pre-wrap";b.textContent=x;var r=document.createElement("div");r.className="ac";
var g=document.createElement("button");g.className="ok";g.textContent="Got it";var m=document.createElement("button");m.className="s2";m.textContent="Explain more";var p=document.createElement("div");p.className="dp";
g.onclick=function(){if(done)return;done=1;g.textContent="✓ Got it";g.disabled=true;S.p++;save();stats()};
m.onclick=function(){d.classList.add("ex");ai().then(function(s){if(!s){p.textContent="AI is not available here. Open this page inside the Claude app.";return}p.textContent="Thinking…";
s("Explain this study card more deeply for a beginner reading on a phone. Topic: "+ts+". Card: "+h+" - "+x+". Max 160 words, plain language, one everyday example, no links, no markdown.",{modelTier:"quick",onText:function(t){p.textContent=t.text}}).catch(function(e){p.textContent="Could not load ("+((e&&e.code)||"error")+"): "+((e&&e.message)||"")})})};
r.appendChild(g);r.appendChild(m);d.appendChild(a);d.appendChild(b);d.appendChild(r);d.appendChild(p);$("feed").appendChild(d);d.style.zIndex=1000-seen.length;d.style.setProperty("--k",Math.min(seen.length-1,5));if(d.offsetHeight>innerHeight*.6)d.classList.add("ex")}
var bt=0;function more(){if(!ts)return;if(busy&&Date.now()-bt<30000){msg("Still loading, one moment…");return}busy=1;bt=Date.now();msg("Loading…");$("mr").hidden=true;
ai().then(function(s){if(!s){busy=0;msg("AI is not available here. Open this page inside the Claude app.");$("mr").hidden=false;return}
n++;s.json("Topic: "+ts+". Write 1 study card, batch "+n+". Batch 1 starts with absolute basics; later batches continue gradually, going slightly deeper each time. Write the card body as one smooth, flowing explanation in 4 or 5 short paragraphs, like a well-written article: no labels, no headings, no bullet points, no dashes at the start of lines. It must naturally cover what the topic is, the key ideas, how it works and why it matters, real numbers, dates or facts where they exist, and one everyday example. If money is involved, use Indian rupees and Indian examples. About 200-260 words in total. Cover new subtopics, not ones already covered. Do not repeat these headings: "+seen.slice(-30).join("; ")+". Return only JSON: [{\"h\":\"heading\",\"x\":\"text\"}]",{modelTier:"quick",cache:false})
.then(function(a){busy=0;if(!Array.isArray(a)||!a.length){n--;msg("Empty answer. Tap Keep going to retry.");$("mr").hidden=false;return}a.forEach(card);if(S.hist[ts]&&S.hist[ts].p.length>=3)summ(ts);msg("");$("mr").hidden=false})
.catch(function(e){busy=0;n--;msg("Could not load ("+((e&&e.code)||"error")+"): "+((e&&e.message)||"")+". Tap Keep going to retry.");$("mr").hidden=false})})}
function go(){var t=$("q").value.trim();if(!t)return;ts=t;n=0;seen=[];$("feed").innerHTML="";S.rec=[t].concat(S.rec.filter(function(x){return x!=t})).slice(0,6);save();chips();more()}
function hist(h,x){var o=S.hist[ts]=S.hist[ts]||{s:"",p:[]};if(!o.p.some(function(z){return z.h==h}))o.p.push({h:h,x:x});save();hlist()}
function summ(t){var o=S.hist[t];if(!o||!o.p.length)return;ai().then(function(s){if(!s)return;var src=o.p.slice();s("Combine these study notes into one compact summary of 3-5 short paragraphs for revision. Keep key ideas, terms and examples. Topic: "+t+".\nExisting summary:\n"+(o.s||"(none)")+"\nNew cards:\n"+src.map(function(c){return c.h+": "+c.x}).join("\n")+"\nReturn plain text only, no markdown.",{modelTier:"quick",cache:false}).then(function(r){if(r&&r.text){o.s=r.text;o.p=o.p.filter(function(c){return !src.some(function(z){return z.h==c.h})});save();hlist()}}).catch(function(){})})}
function hlist(){var el=$("hl");el.innerHTML="";Object.keys(S.hist).reverse().forEach(function(t){var o=S.hist[t],d=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("div");s.textContent=t;d.appendChild(s);p.className="pk";p.style.whiteSpace="pre-wrap";p.textContent=(o.s||"Summary will appear after a few cards, or when you reopen the app.")+(o.s&&o.p.length?"\n\n("+o.p.length+" new cards will join this summary next time)":"");d.appendChild(p);el.appendChild(d)})}
function parks(){$("pl").innerHTML="";S.park.forEach(function(t,i){var d=document.createElement("div");d.className="pk";d.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:8px";var s=document.createElement("span");s.textContent="• "+t;var b=document.createElement("button");b.className="s2";b.textContent="Done ✓";b.onclick=function(){S.park.splice(i,1);save();parks()};d.appendChild(s);d.appendChild(b);$("pl").appendChild(d)})}
$("go").onclick=go;$("cx").onclick=function(){var o=$("ch").classList.toggle("open");$("cx").textContent=o?"−":"+"};$("q").onkeydown=function(e){if(e.key=="Enter")go()};$("mr").onclick=more;
$("pa").onclick=function(){var v=$("pk").value.trim();if(v){S.park.push(v);$("pk").value="";save();parks()}};
function startT(){if(endT)return;endT=Date.now()+900000;$("ts").disabled=true;tick=setInterval(function(){var r=Math.max(0,endT-Date.now()),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);$("tm").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
if(r<=300000)$("tmb").hidden=true;if(r<=0){clearInterval(tick);endT=0;$("ts").disabled=false;$("tmb").hidden=false;$("ts").textContent="Start again";var k=dk(new Date());S.log[k]=(S.log[k]||0)+1;save();stats();toast(S.log[k]>=3?"✅ Full day done!":"Session done: "+S.log[k]+"/3")}},500)}
$("ts").onclick=startT;
$("dl").onclick=function(){claude.use("downloads").then(function(d){if(!d){toast("Download is not available here");return}var t=Object.keys(S.hist).map(function(k){return"# "+k+"\n\n"+(S.hist[k].s||S.hist[k].p.map(function(c){return c.h+": "+c.x}).join("\n"))}).join("\n\n\n");if(!t){toast("Nothing saved yet");return}d.save({filename:"focus-history.txt",data:t}).catch(function(){})})};

load();stats();chips();parks();hlist();Object.keys(S.hist).forEach(summ);startT();$("q").focus();
if(window.Android){if(Android.hasKey())$("ky").placeholder="Key saved (paste a new one to replace)";$("kb").onclick=function(){var v=$("ky").value.trim();if(v){Android.setKey(v);$("ky").value="";toast("Key saved")}};$("ub").onclick=function(){Android.openUsage()};$("bb").onclick=function(){Android.openBattery()}}
function pdfs(){var el=$("pdl");if(!el||!window.Android)return;el.innerHTML="";var l=[];try{l=JSON.parse(Android.pdfList())}catch(e){}
if(!l.length){el.textContent="No PDFs yet. Tap + Add PDF and pick only the ones you want to study.";return}
l.forEach(function(p){var d=document.createElement("div");d.className="pk";d.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:8px";var s=document.createElement("span");s.textContent="\ud83d\udcc4 "+p.n;s.style.cssText="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;cursor:pointer";s.onclick=function(){Android.pdfOpen(p.id)};var b=document.createElement("button");b.className="s2";b.textContent="Remove";b.onclick=function(){Android.pdfDelete(p.id);pdfs()};d.appendChild(s);d.appendChild(b);el.appendChild(d)})}
window.__pdfAdded=pdfs;
if(window.Android){$("pa2").onclick=function(){Android.pdfPick()};pdfs()}
</script></body></html>
