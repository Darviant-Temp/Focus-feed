name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild folder structure
        run: | python3 - <<'PY' import os, shutil for f in os.listdir('.'): if '__' in f and os.path.isfile(f): d = f.replace('__', '/') os.makedirs(os.path.dirname(d), exist_ok=True) shutil.move(f, d) PY       - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFeed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
